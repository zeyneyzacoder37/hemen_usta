<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5"><div class="card shadow p-4 mx-auto" style="max-width: 400px; margin-top: 100px !important;">
        <h3 class="text-center fw-bold text-primary mb-4">Usta Girişi</h3>
        <form method="POST">
            <div class="mb-3"><label class="form-label">Kullanıcı Adı:</label><input type="text" name="isim" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Şifre:</label><input type="password" name="sifre" class="form-control" required></div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Giriş Yap</button>
        </form>
    </div></div>
</body>
</html>
