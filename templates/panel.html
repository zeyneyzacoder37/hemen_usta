<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Usta Yönetim Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand fw-bold" href="/">🛠️ HEMEN USTA</a><div><a href="/" class="btn btn-outline-light btn-sm me-2">Ana Sayfa</a><a href="/logout" class="btn btn-danger btn-sm">Çıkış Yap</a></div></div></nav>
    <div class="container mt-5">
        <h2 class="fw-bold mb-4">Usta Yönetim Paneli (Hoş geldin, {{ session['kullanici_adi'] }})</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow p-3">
                    <h5 class="fw-bold text-primary mb-3">🛠️ Yeni İş/İlan Ekle</h5>
                    <form method="POST" enctype="multipart/form-data">
                        <div class="mb-3"><label class="form-label">Yapılan İş Başlığı:</label><input type="text" name="is_tanimi" class="form-control" placeholder="Örn: Musluk Tamiri" required></div>
                        <div class="mb-3"><label class="form-label">Hizmet Bedeli (TL):</label><input type="number" name="fiyat" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">İşin Fotoğrafı:</label><input type="file" name="foto" class="form-control" accept="image/*" required></div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">İlanı Yayınla</button>
                    </form>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow p-3">
                    <h5 class="fw-bold text-secondary mb-3">💼 Yayındaki İlanlarınız</h5>
                    <div class="row">
                        {% for is in isler %}
                            <div class="col-md-6 mb-3">
                                <div class="border rounded p-2 bg-white">
                                    <img src="/static/uploads/{{ is['foto_yolu'] }}" class="img-fluid rounded mb-2" style="height: 150px; width: 100%; object-fit: cover;">
                                    <h6>{{ is['is_tanimi'] }}</h6>
                                    <p class="text-danger fw-bold mb-0">{{ is['fiyat'] }} TL</p>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
