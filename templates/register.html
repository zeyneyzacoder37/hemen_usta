<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>HemenUsta - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        // Müşteri seçildiğinde usta alanlarını (meslek, hakkında vb.) gizleyen akıllı script
        function rolDegisti() {
            var rol = document.getElementById("rolSelect").value;
            var ustaAlanlari = document.getElementById("ustaOzelAlanlari");
            if (rol === "musteri") {
                ustaAlanlari.style.display = "none";
            } else {
                ustaAlanlari.style.display = "block";
            }
        }
    </script>
</head>
<body class="bg-light">
    <div class="container mt-4 mb-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
            <h3 class="text-center fw-bold text-primary mb-4">HemenUsta Üyelik Formu</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Üyelik Tipi:</label>
                    <select name="rol" id="rolSelect" class="form-select bg-warning fw-bold text-dark" onchange="rolDegisti()" required>
                        <option value="musteri">Müşteri (Usta Arayan)</option>
                        <option value="usta">Usta (Hizmet Veren)</option>
                    </select>
                </div>
                
                <div class="mb-3"><label class="form-label">Adınız Soyadınız:</label><input type="text" name="isim" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Şifreniz:</label><input type="password" name="sifre" class="form-control" required></div>
                <div class="mb-3"><label class="form-label">Telefon:</label><input type="text" name="telefon" class="form-control" placeholder="0555..."></div>
                <div class="mb-3"><label class="form-label">E-Mail:</label><input type="email" name="mail" class="form-control"></div>
                <div class="mb-3"><label class="form-label">Yaşadığınız İlçe:</label><input type="text" name="ilce" class="form-control" placeholder="Örn: Çekmeköy" required></div>
                
                <div id="ustaOzelAlanlari" style="display: none;">
                    <hr>
                    <div class="mb-3"><label class="form-label fw-bold text-success">Uzmanlık Alanınız:</label><select name="meslek" class="form-select"><option value="Su Tesisatçısı">Su Tesisatçısı</option><option value="Elektrikçi">Elektrikçi</option></select></div>
                    <div class="mb-3"><label class="form-label fw-bold text-success">Kendinizden/Tecrübenizden Bahsedin:</label><textarea name="hakkinda" class="form-control" rows="2"></textarea></div>
                </div>
                
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-3">Kayıt İşlemini Tamamla</button>
            </form>
        </div>
    </div>
</body>
</html>
